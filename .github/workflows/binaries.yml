name: binaries

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        build: [linux-x86_64-musl, linux-aarch64-musl, macos-x86_64, macos-aarch64]
        include:
        - build: linux-x86_64-musl
          os: ubuntu-24.04
          target: x86_64-unknown-linux-musl
        - build: linux-aarch64-musl
          os: ubuntu-24.04-arm
          target: aarch64-unknown-linux-musl
        - build: macos-x86_64
          os: macos-15
          target: x86_64-apple-darwin
        - build: macos-aarch64
          os: macos-15
          target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    name: Build binary artifacts
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install packages (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xz-utils liblz4-tool musl-tools
      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
          target: ${{ matrix.target }}
      - name: Build release binary
        shell: bash
        run: cargo build --target ${{ matrix.target }} --verbose --release
      - name: Set up artifact directory
        shell: bash
        run: |
          outdir="target/${{ matrix.target }}/release"
          mkdir -p target/out
          cp $outdir/jj target/out
      - name: Publish binary artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: jj-${{ matrix.target }}
          path: target/out

  release:
    needs: binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    name: Update rolling release
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with:
          path: artifacts

      - name: Package artifacts
        shell: bash
        run: |
          mkdir -p release
          for dir in artifacts/jj-*/; do
            target=$(basename "$dir" | sed 's/^jj-//')
            chmod +x "$dir/jj"
            tar -czf "release/jj-${target}.tar.gz" -C "$dir" jj
          done

      - name: Create or update rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create latest \
            --title "Latest Build" \
            --notes "Rolling release — updated on every push to main." \
            --prerelease \
            release/* \
            2>/dev/null || \
          gh release upload latest \
            release/* \
            --clobber
